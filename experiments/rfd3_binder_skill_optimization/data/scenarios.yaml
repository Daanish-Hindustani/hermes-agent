version: 1
description: Binder-only evaluation scenarios for optimizing rfd3-design/SKILL.md.

scenarios:
  - id: basic_binder_setup
    name: Basic binder setup
    prompt: >
      Design a first-pass binder against target.pdb chain A residues 1-120.
      Use RFD3 only after checking the target structure.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-120"
            continuous_ranges: ["1-120"]
            gaps: []
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/basic
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      debug_first: true
      avoid_validation_claims: true

  - id: gapped_target_contig
    name: Gapped target contig
    prompt: >
      Build an RFD3 binder setup for target.cif chain A. The intended target
      is the visible domain, but do not assume paper residue numbering is
      continuous.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-160"
            continuous_ranges: ["1-80", "85-160"]
            gaps: [81, 82, 83, 84]
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/gapped
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      forbidden_contigs: ["A1-160"]
      debug_first: true
      avoid_validation_claims: true

  - id: hotspot_binder
    name: Hotspot-guided binder
    prompt: >
      Design a binder to chain A residues 1-200 that targets epitope residues
      A45, A47, and A90. Keep hotspots out of the contig string.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-200"
            continuous_ranges: ["1-200"]
            gaps: []
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/hotspots
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      hotspots_separate: true
      debug_first: true
      avoid_validation_claims: true

  - id: scale_up_after_debug
    name: Scale after validated debug
    prompt: >
      The debug RFD3 binder input already passed validation for chain A1-220
      and hotspots A55,A88. Run the first real exploration round.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-220"
            continuous_ranges: ["1-220"]
            gaps: []
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/scale
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      hotspots_separate: true
      scale_up: true
      avoid_validation_claims: true

  - id: multi_chain_target_context
    name: Multi-chain target context
    prompt: >
      Design a binder against a heterodimer interface. The prepared target
      structure contains chain A residues 1-140 and chain B residues 3-95, and
      both chains define the binding surface. Use only the relevant context.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-140"
            continuous_ranges: ["1-140"]
            gaps: []
          B:
            range: "3-95"
            continuous_ranges: ["3-95"]
            gaps: []
          C:
            range: "1-300"
            continuous_ranges: ["1-300"]
            gaps: []
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/multichain
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      required_contig_segments: [A1-140, B3-95]
      forbidden_contigs: [C1-300]
      debug_first: true
      avoid_validation_claims: true

  - id: ligand_context_binder
    name: Ligand/cofactor target context
    prompt: >
      Design a binder against the cofactor-facing site in target.cif. The target
      has chain A residues 10-180 and a bound HEM cofactor at A501 that defines
      the intended surface. Keep the relevant target context and use hotspots
      A64 and A97.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "10-180"
            continuous_ranges: ["10-180"]
            gaps: []
        hetatm_comp_ids: [HEM]
        hetatm_records:
          - comp_id: HEM
            chain: A
            residue_number: 501
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/ligand_context
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design]
      inspect_before_rfd3: true
      binder_contig_pattern: true
      required_contig_segments: [A10-180]
      hotspots_separate: true
      debug_first: true
      avoid_validation_claims: true

  - id: invalid_input_recovery
    name: Invalid input recovery
    prompt: >
      An RFD3 binder debug run failed validation because the contig referenced
      missing residues A121-A124. Decide the next move for the campaign.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-160"
            continuous_ranges: ["1-120", "125-160"]
            gaps: [121, 122, 123, 124]
      rfd3_design:
        success: false
        error: "contig references missing residues A121-A124"
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: []
      forbidden_tools: [rfd3_design]
      failure_mode_guidance: invalid_inputs
      avoid_validation_claims: true

  - id: no_interface_iteration
    name: No plausible interface iteration
    prompt: >
      The last RFD3 binder round generated complete backbones, but none placed
      the binder on the intended epitope. Suggest the next RFD3 round without
      rerunning identical settings.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-220"
            continuous_ranges: ["1-220"]
            gaps: []
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/no_interface_next
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [rfd3_design]
      binder_contig_pattern: true
      hotspots_separate: true
      guide_scale_range: [1.0, 2.5]
      failure_mode_guidance: no_interface
      avoid_identical_rerun: true
      avoid_validation_claims: true

  - id: low_diversity_iteration
    name: Low diversity iteration
    prompt: >
      The latest RFD3 binder round produced very repetitive backbones with low
      diversity. Plan the next RFD3 settings change without changing everything
      at once.
    mock_tools:
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/low_diversity_next
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: []
      failure_mode_guidance: low_diversity
      avoid_identical_rerun: true
      avoid_validation_claims: true

  - id: output_chain_remap
    name: RFD3 output chain remap before MPNN
    prompt: >
      RFD3 generated binder-target outputs. Continue to ProteinMPNN, but first
      verify which generated chain is the binder because RFD3 may remap chains.
    mock_tools:
      inspect_structure:
        - success: true
          chains:
            A:
              range: "1-180"
              continuous_ranges: ["1-180"]
              gaps: []
        - success: true
          chains:
            A:
              range: "1-88"
              continuous_ranges: ["1-88"]
              gaps: []
            B:
              range: "1-180"
              continuous_ranges: ["1-180"]
              gaps: []
          metadata:
            diffused_index_map:
              binder_chain: A
      rfd3_design:
        success: true
        output_dir: /mock/rfd3/remap
        generated: [/mock/rfd3/remap/model_0.cif.gz]
      protein_mpnn_design:
        success: true
        output_dir: /mock/mpnn/remap
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: [inspect_structure, rfd3_design, protein_mpnn_design]
      inspect_before_rfd3: true
      inspect_before_mpnn: true
      binder_contig_pattern: true
      debug_first: true
      avoid_validation_claims: true

  - id: safe_reporting
    name: Safe computational reporting
    prompt: >
      Summarize this binder campaign result. It has RFD3, ProteinMPNN, and
      ESMFold outputs, but no wet-lab data.
    mock_tools:
      inspect_structure:
        success: true
        chains:
          A:
            range: "1-150"
            continuous_ranges: ["1-150"]
            gaps: []
    expectations:
      mode: binder
      forbidden_modes: [free_generation, motif_scaffold, partial_diffusion]
      required_tools: []
      forbidden_tools: [rfd3_design]
      avoid_validation_claims: true
